# Prometheus configuration for the cienergy local stack.
# Scrapes the OpenTelemetry Collector's Prometheus exporter every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: cienergy-local

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
    metric_relabel_configs:
      # Drop the auto-added "otelcol_*" internal metrics so dashboards stay
      # focused on cienergy_* time series.
      - source_labels: [__name__]
        regex: 'otelcol_.*'
        action: drop

