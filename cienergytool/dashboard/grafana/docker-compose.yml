services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cienergy
      POSTGRES_USER: cienergy
      POSTGRES_PASSWORD: cienergy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cienergy -d cienergy"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingester:
    build:
      context: ../../          # repo root, so the Dockerfile can see ./cmd and ./internal
      dockerfile: cmd/ingester/Dockerfile
    image: cienergy/ingester:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: '8080'
      POSTGRES_URL: 'postgres://cienergy:cienergy@postgres:5432/cienergy?sslmode=disable'
      INGESTER_TOKEN: '${INGESTER_TOKEN:-}'    # empty = anonymous ingestion
      MAX_BODY_BYTES: '1048576'
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.1.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:



