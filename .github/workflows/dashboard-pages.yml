# ─────────────────────────────────────────────────────────────────────────────
# cienergy — build the embedded dashboard and publish it on GitHub Pages.
#
# Mirrors what `run.sh` does locally (build → clone remotes → aggregate → CSRD
# export → stage `dashboard/embedded/local-reports/`), but instead of starting
# a local HTTP server it uploads the dashboard as a Pages artifact and deploys
# it. The published URL auto-loads the freshly generated reports.
#
# Trigger:
#   • push to main (only when sources that affect the report change)
#   • weekly schedule (Mondays 06:00 UTC) for a fresh CSRD snapshot
#   • manual run with overridable inputs
#
# Configure via repository variables / secrets (Settings → Variables → Actions):
#   vars.REGION           Electricity Maps zone (default: FR)
#   vars.REPOS            comma-separated repo list (default: the demo set)
#   vars.REPO_REMOTES     'slug=git-url,…' to clone & analyse extra repos
#   vars.CSRD_BY          run|day|month|repository|team|cost-center  (default: repository)
#   vars.CLONE_DEPTH      shallow-clone depth for remotes (default: 1)
# ─────────────────────────────────────────────────────────────────────────────
name: dashboard-pages

on:
  push:
    branches: [main]
    paths:
      - "cienergytool/cmd/**"
      - "cienergytool/internal/**"
      - "cienergytool/dashboard/embedded/**"
      - "cienergytool/examples/samples/**"
      - "cienergytool/run.sh"
      - "cienergytool/go.mod"
      - "cienergytool/go.sum"
      - ".github/workflows/dashboard-pages.yml"
  schedule:
    # Weekly refresh so the CSRD CSV always reflects ≤ 7 day-old grid data.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      region:
        description: "Electricity Maps zone (e.g. FR, DE, US-CA)"
        required: false
        default: ""
      repos:
        description: "Comma-separated repos (slugs or git URLs)"
        required: false
        default: ""
      repo_remotes:
        description: "Extra remotes to clone: slug=url,slug2=url2"
        required: false
        default: ""

# Pages deploy requires these scopes; restrict the rest.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel queued runs on the same ref.
# NOTE: the docs.yml workflow also targets GitHub Pages — only one of the two
# can actually be the published site of the repo at any time (last deploy wins).
concurrency:
  group: "pages-dashboard-${{ github.ref }}"
  cancel-in-progress: false

env:
  # Resolution order: workflow_dispatch input → repo var → hard-coded default.
  REGION:         ${{ inputs.region        || vars.REGION        || 'FR' }}
  REPOS:          ${{ inputs.repos         || vars.REPOS         || 'myorg/green-api-workshop-final,https://github.com/thiernodialloAFA/creedengo-java,https://github.com/thiernodialloAFA/creedengo-rules-specifications' }}
  REPO_REMOTES:   ${{ inputs.repo_remotes  || vars.REPO_REMOTES  || '' }}
  CSRD_BY:        ${{ vars.CSRD_BY         || 'repository' }}
  CLONE_DEPTH:    ${{ vars.CLONE_DEPTH     || '1' }}
  # Disable the local-only side-effects of run.sh in CI.
  SKIP_GPU:       "1"
  SKIP_OTLP:      "1"
  OPEN_DASHBOARD: "0"
  INGESTER_URL:   "http://127.0.0.1:0"   # never reachable → ingest step is skipped
  # Pin the artifact path so the deploy job stays in sync with the build job.
  # Paths used by GitHub actions (uses/path) are relative to the repo root,
  # so they include the cienergytool/ prefix.
  PROJECT_DIR:    "cienergytool"
  DASHBOARD_DIR:  "cienergytool/dashboard/embedded"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1) Build binaries, analyse repos, stage reports into dashboard/embedded.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build dashboard with fresh reports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cienergytool

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cienergytool/go.mod
          cache: true
          cache-dependency-path: cienergytool/go.sum

      - name: Set up Python (used by run.sh's cidetect pretty-print)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Reproducible build of the 4 binaries run.sh needs.
      - name: Build cienergy binaries
        run: |
          mkdir -p bin
          go build -trimpath -o ./bin/cienergy-aggregator  ./cmd/aggregator
          go build -trimpath -o ./bin/cienergy-csrd-export ./cmd/csrd-export
          go build -trimpath -o ./bin/cienergy-cidetect    ./cmd/cidetect
          go build -trimpath -o ./bin/cienergy-gpu-probe   ./cmd/gpu-probe
          ls -lh ./bin

      # Re-uses every step in run.sh: clone-remotes → aggregate → CSRD export
      # → stage dashboard/embedded/local-reports/. Browser-opening and the
      # local HTTP server are disabled via OPEN_DASHBOARD=0 above.
      - name: Run cienergy analysis (run.sh)
        env:
          REGION:        ${{ env.REGION }}
          REPOS:         ${{ env.REPOS }}
          REPO_REMOTES:  ${{ env.REPO_REMOTES }}
          CSRD_BY:       ${{ env.CSRD_BY }}
          CLONE_DEPTH:   ${{ env.CLONE_DEPTH }}
          SKIP_GPU:      ${{ env.SKIP_GPU }}
          SKIP_OTLP:     ${{ env.SKIP_OTLP }}
          OPEN_DASHBOARD: ${{ env.OPEN_DASHBOARD }}
          INGESTER_URL:  ${{ env.INGESTER_URL }}
        run: |
          chmod +x ./run.sh
          ./run.sh

      # Visitors of <user>.github.io/<repo>/ land on a bare index.html that
      # waits for ?src=…  Inject a tiny default-redirect so the dashboard
      # auto-loads the freshly staged reports without any user action.
      - name: Wire default ?src for Pages visitors
        working-directory: ${{ github.workspace }}
        run: |
          dir="${{ env.DASHBOARD_DIR }}"
          test -f "$dir/index.html" || { echo "::error::missing $dir/index.html"; exit 1; }
          test -f "$dir/local-reports/index.json" || {
            echo "::warning::no local-reports/index.json — Pages will load empty";
          }
          # Make sure GitHub Pages serves files prefixed with "_" too.
          touch "$dir/.nojekyll"
          # Idempotent insert just before </head>.
          if ! grep -q 'cienergy-pages-autoload' "$dir/index.html"; then
            DASHBOARD_DIR="$dir" python3 - <<'PY'
          import os, pathlib, sys
          p = pathlib.Path(os.environ["DASHBOARD_DIR"]) / "index.html"
          html = p.read_text(encoding="utf-8")
          inject = (
            '  <script id="cienergy-pages-autoload">\n'
            '    // Auto-load the report bundle staged by GitHub Actions when\n'
            '    // visitors arrive without an explicit ?src=… query.\n'
            '    (function () {\n'
            '      var qs = new URLSearchParams(location.search);\n'
            '      if (!qs.get("src")) {\n'
            '        location.replace(location.pathname + "?src=./local-reports/index.json" + location.hash);\n'
            '      }\n'
            '    })();\n'
            '  </script>\n'
            '</head>'
          )
          if "</head>" not in html:
            sys.exit("</head> not found in index.html")
          p.write_text(html.replace("</head>", inject, 1), encoding="utf-8")
          PY
            echo "✓ injected autoload script"
          else
            echo "↻ autoload script already present"
          fi
          echo "::group::dashboard tree"
          find "$dir" -maxdepth 2 -type f | sort
          echo "::endgroup::"

      # Keep a copy of the raw reports as a regular workflow artifact too —
      # handy for ad-hoc download / diffing across runs.
      - name: Upload raw reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: cienergy-reports
          path: |
            cienergytool/reports/
            ${{ env.DASHBOARD_DIR }}/local-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DASHBOARD_DIR }}

  # ───────────────────────────────────────────────────────────────────────────
  # 2) Deploy the artifact built above to GitHub Pages.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

