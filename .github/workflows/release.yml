# Builds cienergy binaries for all supported (OS, arch), signs them with
# cosign (keyless, OIDC-based), and attaches SLSA Level 3 provenance to the
# GitHub Release.
#
# Triggered by pushing a tag matching v*.*.*.
#
# Required permissions are scoped per-job (least privilege).
# See: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
#      https://docs.sigstore.dev/cosign/openid_signing/
#      https://slsa.dev/spec/v1.0/levels

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build cross-platform binaries reproducibly.
  #    Each matrix instance emits its per-platform sha256 list as a job output
  #    AND uploads a small "<platform>.sha256" artifact so the next job can
  #    fan-in and produce a single base64 subjects blob for the SLSA generator.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cienergytool
    outputs:
      # Per-matrix sha256 line(s), surfaced to the fan-in job below.
      hash-linux-amd64:   ${{ steps.hash.outputs.linux-amd64 }}
      hash-linux-arm64:   ${{ steps.hash.outputs.linux-arm64 }}
      hash-darwin-amd64:  ${{ steps.hash.outputs.darwin-amd64 }}
      hash-darwin-arm64:  ${{ steps.hash.outputs.darwin-arm64 }}
      hash-windows-amd64: ${{ steps.hash.outputs.windows-amd64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: cienergytool/go.sum

      - name: Build (reproducible)
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          mkdir -p dist
          for cmd in aggregator ingester gpu-probe gate csrd-export; do
            out="dist/cienergy-${cmd}-${GOOS}-${GOARCH}${{ matrix.ext }}"
            go build -trimpath \
              -buildvcs=false \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$out" "./cmd/${cmd}"
          done
          (cd dist && sha256sum cienergy-* > checksums.txt)

      - name: Capture per-platform sha256 subjects
        id: hash
        run: |
          set -euo pipefail
          # Emit ONLY the lines for binaries (not checksums.txt itself), then
          # publish them as a job output keyed by "<goos>-<goarch>". The
          # fan-in job concatenates all platform lists and base64-encodes
          # them for the SLSA generator.
          key="${{ matrix.goos }}-${{ matrix.goarch }}"
          # GitHub Actions job outputs must be single-line; we keep the raw
          # sha256 lines and escape newlines with %0A so we can decode later.
          lines="$(cd dist && grep -E 'cienergy-[a-z-]+-[a-z0-9]+-[a-z0-9]+(\.exe)?$' checksums.txt | tr '\n' '\v')"
          {
            echo "${key}<<__EOF__"
            printf '%s' "$lines"
            echo
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cienergy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cienergytool/dist/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) Fan-in: concatenate every per-platform sha256 list into ONE base64
  #    blob that the SLSA reusable workflow can consume as `base64-subjects`.
  #    Reusable workflows can't read matrix outputs directly, so we proxy
  #    through a plain job that emits a single string output.
  # ---------------------------------------------------------------------------
  combine-hashes:
    name: Combine sha256 subjects
    needs: [build]
    runs-on: ubuntu-22.04
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - id: combine
        env:
          H_LINUX_AMD64:   ${{ needs.build.outputs.hash-linux-amd64 }}
          H_LINUX_ARM64:   ${{ needs.build.outputs.hash-linux-arm64 }}
          H_DARWIN_AMD64:  ${{ needs.build.outputs.hash-darwin-amd64 }}
          H_DARWIN_ARM64:  ${{ needs.build.outputs.hash-darwin-arm64 }}
          H_WINDOWS_AMD64: ${{ needs.build.outputs.hash-windows-amd64 }}
        run: |
          set -euo pipefail
          # Re-expand the \v line separator used in the build job.
          all="$(printf '%s' \
            "$H_LINUX_AMD64" "$H_LINUX_ARM64" "$H_DARWIN_AMD64" "$H_DARWIN_ARM64" "$H_WINDOWS_AMD64" \
            | tr '\v' '\n' | sed '/^$/d')"
          echo "──── subjects ────"
          printf '%s\n' "$all"
          echo "──────────────────"
          if [[ -z "$all" ]]; then
            echo "::error::no sha256 subjects collected from the build matrix"
            exit 1
          fi
          # `base64-subjects` expects the file content base64-encoded
          # (no newline). The SLSA generator decodes & parses it as a
          # standard `sha256sum` checksum listing.
          encoded="$(printf '%s\n' "$all" | base64 -w0)"
          echo "hashes=${encoded}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 3) Generate SLSA Level 3 provenance for every artifact via the official
  #    reusable workflow. This produces a sigstore-signed in-toto attestation.
  # ---------------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: [build, combine-hashes]
    permissions:
      id-token: write    # cosign OIDC
      contents: write    # write release notes
      actions: read      # for build context
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.combine-hashes.outputs.hashes }}
      provenance-name: cienergy.intoto.jsonl
      upload-assets: true

  # ---------------------------------------------------------------------------
  # 3) Sign each binary with cosign (keyless OIDC) and publish the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: sign & release
    needs: [build, provenance]
    runs-on: ubuntu-22.04
    permissions:
      contents: write    # create release + upload assets
      id-token: write    # OIDC token used by cosign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-merged

      - name: Flatten
        run: |
          set -euxo pipefail
          mkdir -p dist
          find dist-merged -type f -exec cp -t dist {} +
          (cd dist && sha256sum cienergy-* > checksums.txt)
          ls -la dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with: { cosign-release: 'v2.4.0' }

      - name: Sign binaries with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euxo pipefail
          for f in dist/cienergy-*; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: |
            dist/cienergy-*
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## Supply-chain assurance

            All binaries are:
            - **Signed** with [cosign](https://www.sigstore.dev/) (keyless OIDC; identity = this workflow run).
            - Accompanied by [**SLSA Level 3**](https://slsa.dev/spec/v1.0/levels) provenance (`cienergy.intoto.jsonl`).
            - Reproducible (`-trimpath -buildvcs=false`, `SOURCE_DATE_EPOCH=0`).

            ### Verify

            ```sh
            cosign verify-blob \
              --certificate cienergy-aggregator-linux-amd64.pem \
              --signature   cienergy-aggregator-linux-amd64.sig \
              --certificate-identity-regexp 'https://github.com/axa-oss/cienergytool/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              cienergy-aggregator-linux-amd64

            slsa-verifier verify-artifact \
              --provenance-path cienergy.intoto.jsonl \
              --source-uri      github.com/axa-oss/cienergytool \
              cienergy-aggregator-linux-amd64
            ```

