# Publish the MkDocs site to GitHub Pages on every push to main.
# Sources live under cienergytool/ — mkdocs is run from there, and the
# built site (cienergytool/site) is uploaded as the Pages artifact.

name: docs

on:
  push:
    branches: [ main ]
    paths:
      - 'cienergytool/docs/**'
      - 'cienergytool/mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cienergytool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cienergytool/site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4



