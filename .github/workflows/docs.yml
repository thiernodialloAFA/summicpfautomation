# Publish the MkDocs site to GitHub Pages on every push to main.
# Sources live under cienergytool/ — mkdocs is run from there, and the
# built site (cienergytool/site) is uploaded as the Pages artifact.

name: docs

on:
  push:
    branches: [ main ]
    paths:
      - 'cienergytool/docs/**'
      - 'cienergytool/mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cienergytool
    env:
      # Silence the Material-for-MkDocs MOTD that warns about the upcoming
      # MkDocs 2.0 (informational only, but it pollutes the log and is often
      # mistaken for an error). See:
      # https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
      MKDOCS_MATERIAL_DISABLE_NEWS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No `cache: pip` here on purpose — we don't ship a requirements.txt
          # nor a pyproject.toml, so setup-python's cache lookup would fail
          # with: "No file matched to [**/requirements.txt or **/pyproject.toml]".
          # The two packages below install in <5 s; not worth caching.
      - name: Install MkDocs (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.5,<2" "mkdocs-material>=9.5,<9.6"
          mkdocs --version

      # mkdocs.yml references 9 files via "../" (READMEs, action.yml, PLAN.md).
      # Vanilla MkDocs forbids that — docs_dir is sealed and "../" lookups
      # become 10 strict-mode-fatal warnings. We mirror those files into docs/
      # on the runner only (the repo itself is untouched) and rewrite the
      # "../" prefixes accordingly. Idempotent: re-runs do nothing harmful.
      - name: Mirror external pages into docs/
        run: |
          set -euo pipefail
          # Files referenced from mkdocs.yml's nav via "../<path>" — copy each
          # to docs/<path> so MkDocs finds them.
          externals=(
            cmd/ingester/README.md
            bridges/codecarbon/README.md
            PLAN.md
            action/action.yml
            pipeline/azure-devops/README.md
            pipeline/gitlab-ci/README.md
            pipeline/jenkins/README.md
            dashboard/embedded/README.md
            dashboard/grafana/README.md
          )
          for rel in "${externals[@]}"; do
            src="$rel"
            dst="docs/$rel"
            if [[ -f "$src" ]]; then
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              echo "  mirrored  $src → $dst"
            else
              echo "::warning::external doc missing on disk: $src"
            fi
          done

          # Drop the "../" prefix in mkdocs.yml so nav entries point to the
          # mirrored copies inside docs/.
          sed -i 's|\.\./||g' mkdocs.yml
          # Same for the one in-page Markdown link inside methodology.md.
          sed -i 's|(\.\./PLAN\.md|(PLAN.md|g' docs/methodology.md

          echo "::group::patched mkdocs.yml nav"
          sed -n '/^nav:/,$p' mkdocs.yml
          echo "::endgroup::"

      # Build WITHOUT --strict on purpose. The mirrored external READMEs
      # (cmd/ingester, pipeline/*, bridges/*, PLAN.md) contain links written
      # against their original on-repo location (e.g. ../../docs/…). Those
      # warn but are harmless — the published site still renders. Real errors
      # ("ERROR -" prefix) still fail the build via mkdocs's exit code.
      # Re-enable --strict locally if you want to chase every cross-link.
      - name: Build site
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cienergytool/site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4



